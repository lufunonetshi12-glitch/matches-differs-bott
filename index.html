<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches & Differs Bot</title>
<style>
body{font-family:Arial;background:#0b1020;color:white;padding:20px}
.box{max-width:500px;margin:auto;background:#151c32;padding:25px;border-radius:18px}
h1{text-align:center}
label{display:block;margin-top:15px}
input,select,button{width:100%;padding:14px;margin-top:7px;border:0;border-radius:8px;box-sizing:border-box}
button{background:#18a558;color:white;font-weight:bold;margin-top:20px}
.stop{background:#d33}
#status{margin-top:20px;padding:14px;background:#0b1020;border-radius:8px}
</style>
</head>

<body>
<div class="box">

<h1>🎯 Matches & Differs Bot</h1>

<label>Deriv App ID</label>
<input id="appId" placeholder="Enter App ID">

<label>Symbol</label>
<select id="symbol">
<option value="R_75">Volatility 75</option>
<option value="R_100">Volatility 100</option>
<option value="R_50">Volatility 50</option>
</select>

<label>Trade Type</label>
<select id="tradeType">
<option value="match">Matches</option>
<option value="differs">Differs</option>
</select>

<label>Prediction Digit</label>
<select id="digit">
<option>0</option><option>1</option><option>2</option>
<option>3</option><option>4</option><option>5</option>
<option>6</option><option>7</option><option>8</option>
<option>9</option>
</select>

<label>Stake</label>
<input id="stake" type="number" value="0.35" min="0.01">

<button id="connect">CONNECT TO DERIV</button>
<button id="start">START BOT</button>
<button id="stop" class="stop">STOP BOT</button>

<div id="status">Status: Waiting</div>

</div>

<script>
let ws=null;
let running=false;

function status(text){
document.getElementById("status").textContent="Status: "+text;
}

document.getElementById("connect").onclick=function(){

let appId=document.getElementById("appId").value.trim();

if(!appId){
status("Enter your App ID");
return;
}

status("Connecting...");

ws=new WebSocket(
"wss://ws.derivws.com/websockets/v3?app_id="+appId
);

ws.onopen=function(){
status("Connected to Deriv");

let symbol=document.getElementById("symbol").value;

ws.send(JSON.stringify({
ticks:symbol,
subscribe:1
}));
};

ws.onmessage=function(event){

let data=JSON.parse(event.data);

if(data.tick){
let quote=String(data.tick.quote);
let lastDigit=quote.slice(-1);

status("Connected • Last digit: "+lastDigit);
}

if(data.error){
status("Error: "+data.error.message);
}
};

ws.onerror=function(){
status("Connection error");
};

ws.onclose=function(){
status("Disconnected");
};
};

document.getElementById("start").onclick=function(){

if(!ws || ws.readyState!==WebSocket.OPEN){
status("Connect to Deriv first");
return;
}

running=true;
status("Bot started — waiting for signal");
};

document.getElementById("stop").onclick=function(){

running=false;
status("Bot stopped");
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches & Differs Bot</title>
<style>
body{font-family:Arial,sans-serif;background:#0b1020;color:white;margin:0;padding:20px}
.box{max-width:500px;margin:auto;background:#151c32;padding:25px;border-radius:18px}
h1{text-align:center}
label{display:block;margin-top:15px}
input,select,button{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:0;box-sizing:border-box}
button{background:#18a558;color:white;font-weight:bold;margin-top:20px;cursor:pointer}
.stop{background:#d33}
.status{margin-top:20px;padding:12px;background:#0b1020;border-radius:8px}
.small{font-size:13px;color:#aaa;margin-top:15px}
</style>
</head>

<body>
<div class="box">
<h1>🎯 Matches & Differs Bot</h1>

<label>Deriv App ID</label>
<input id="appId" placeholder="Enter your App ID">

<label>Symbol</label>
<select id="symbol">
<option value="R_75">Volatility 75</option>
<option value="R_100">Volatility 100</option>
<option value="R_50">Volatility 50</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
</select>

<label>Trade Type</label>
<select id="tradeType">
<option value="match">Matches</option>
<option value="differs">Differs</option>
</select>

<label>Prediction Digit</label>
<select id="digit">
<option>0</option><option>1</option><option>2</option>
<option>3</option><option>4</option><option>5</option>
<option>6</option><option>7</option><option>8</option>
<option>9</option>
</select>

<label>Stake</label>
<input id="stake" type="number" value="0.35" min="0.01" step="0.01">

<button onclick="connect()">CONNECT TO DERIV</button>
<button onclick="startBot()">START BOT</button>
<button class="stop" onclick="stopBot()">STOP BOT</button>

<div class="status" id="status">Status: Waiting</div>

<div class="small">
Use demo trading first. Never place a real trade until you have tested the bot.
</div>
</div>

<script>
let ws=null;
let running=false;

function setStatus(msg){
    document.getElementById("status").innerText="Status: "+msg;
}

function connect(){
    const appId=document.getElementById("appId").value.trim();

    if(!appId){
        setStatus("Enter your Deriv App ID");
        return;
    }

    ws=new WebSocket(
        "wss://ws.derivws.com/websockets/v3?app_id="+encodeURIComponent(appId)
    );

    ws.onopen=()=>{
        setStatus("Connected to Deriv");
        ws.send(JSON.stringify({ticks:"R_75"}));
    };

    ws.onmessage=(event)=>{
        const data=JSON.parse(event.data);

        if(data.tick){
            setStatus(
                "Connected • Last digit: "+
                String(data.tick.quote).slice(-1)
            );
        }
    };

    ws.onerror=()=>{
        setStatus("Connection error");
    };

    ws.onclose=()=>{
        setStatus("Disconnected");
    };
}

function startBot(){
    if(!ws || ws.readyState!==WebSocket.OPEN){
        setStatus("Connect to Deriv first");
        return;
    }

    running=true;
    setStatus("Bot started — waiting for signal");
}

function stopBot(){
    running=false;
    setStatus("Bot stopped");
}
</script>

</body>
</html>
